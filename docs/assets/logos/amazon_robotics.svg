<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <!-- Amazon Black Wordmark -->
  <text x="0" y="82" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#000000">amazon</text>
  
  <!-- Amazon Smile Arrow -->
  <path d="M 24 98 C 55 114 105 114 132 94" stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 124 90 L 138 93 L 132 103 Z" fill="#000000"/>

  <!-- Orange Robotics Wordmark with generous horizontal separation -->
  <text x="210" y="82" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="400" letter-spacing="-0.5" fill="#FF7700">robotics</text>
  
  <!-- Connected Orange Nodes Diagram on top-right -->
  <circle cx="430" cy="24" r="8" stroke="#FF7700" stroke-width="6" fill="#FFFFFF"/>
  <circle cx="475" cy="40" r="11" stroke="#FF7700" stroke-width="7" fill="#FFFFFF"/>
  <circle cx="452" cy="85" r="15" fill="#FF7700"/>
  <line x1="430" y1="24" x2="475" y2="40" stroke="#FF7700" stroke-width="7" stroke-linecap="round"/>
  <line x1="475" y1="40" x2="452" y2="85" stroke="#FF7700" stroke-width="7" stroke-linecap="round"/>
</svg>
